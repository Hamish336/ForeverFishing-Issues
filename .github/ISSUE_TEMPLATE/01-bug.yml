name: Report a bug
description: Tell us what went wrong while using Forever Fishing.
labels: ["bug", "status: unconfirmed"]
body:
  - type: input
    id: version
    attributes:
      label: Forever Fishing version
      description: 'In WoW, open the AddOns list and hover over Forever Fishing to see its version. You can also check My Addons in the CurseForge app or the name of the ZIP you installed.'
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: 'Please give a detailed description of what happened.'
    validations:
      required: true
  - type: textarea
    id: activity
    attributes:
      label: What were you doing when it happened?
      description: 'Tell us what you were doing just before the issue. If you can make it happen again, list the steps.'
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: In-game diagnostics (preferred)
      description: 'Paste your Forever Fishing diagnostics report here.'
      render: text
  - type: textarea
    id: extras
    attributes:
      label: Screenshots, videos, or error messages (optional)
      description: 'Anything you attach is public.'
