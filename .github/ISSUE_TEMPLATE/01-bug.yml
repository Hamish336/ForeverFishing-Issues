name: Report a bug
description: Tell us what went wrong while using Forever Fishing.
labels: ["bug", "status: unconfirmed"]
body:
  - type: input
    id: version
    attributes:
      label: Forever Fishing version
      description: 'In WoW, open the AddOns list and hover over Forever Fishing to see its version. You can also check My Addons in the CurseForge app or the name of the ZIP you installed.'
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: 'Describe what you expected to happen and what happened instead.'
    validations:
      required: true
  - type: textarea
    id: activity
    attributes:
      label: What were you doing when it happened?
      description: 'Tell us what you were doing just before the issue. If you can make it happen again, list the steps.'
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: In-game diagnostics (optional)
      description: >-
        If you have a report copied from Forever Fishing, paste it here.
        For fishing key or reeling problems, you can also paste a `/fish trace`
        captured while the problem is happening.
        Reports are public, so remove private details before posting.
      render: text
  - type: textarea
    id: extras
    attributes:
      label: Screenshots, videos, or error messages (optional)
      description: 'Anything you attach is public.'
