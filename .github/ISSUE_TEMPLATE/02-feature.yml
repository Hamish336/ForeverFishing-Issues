name: Suggest a feature
description: Share an idea for improving Forever Fishing.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: How would it help you?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples or screenshots (optional)
      description: 'Share an example or attach a screenshot if it helps explain your idea. Anything you attach is public.'
